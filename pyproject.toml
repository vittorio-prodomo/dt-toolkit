[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "detection-toolkit"
version = "0.1.0"
description = "Modular building blocks for object-detection & instance-segmentation workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Vittorio Prodomo" },
]
keywords = [
    "object-detection",
    "instance-segmentation",
    "dataset-management",
    "tiling",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "cocoyolo>=0.1.0",
    "numpy",
    "opencv-python-headless>=4.5",
    "pycocotools>=2.0",
    "PyYAML>=5.0",
    "pyvips>=2.2",
    "shapely>=2.0",
    "tqdm",
]

[project.optional-dependencies]
fiftyone = [
    "fiftyone",
    "voxel51-eta",
    "fiftyone-brain",
]
reduce = [
    "umap-learn",
    "pacmap",
    "scikit-learn",
]
cluster = [
    "scikit-learn",
]
embed = [
    "transformers",
    "torch",
]
all = [
    "detection-toolkit[fiftyone,embed,reduce,cluster]",
]

[project.scripts]
dt-ingest = "detection_toolkit.scripts.ingest:main"
dt-convert = "detection_toolkit.scripts.convert:main"
dt-tile = "detection_toolkit.scripts.tile:main"
dt-filter = "detection_toolkit.scripts.filter:main"
dt-merge = "detection_toolkit.scripts.merge:main"
dt-import-fo = "detection_toolkit.scripts.import_fo:main"
dt-export-fo = "detection_toolkit.scripts.export_fo:main"
dt-enrich = "detection_toolkit.scripts.enrich:main"
dt-cvat = "detection_toolkit.scripts.cvat:main"
dt-coreset = "detection_toolkit.scripts.coreset:main"
dt-reduce = "detection_toolkit.scripts.reduce:main"
dt-cluster = "detection_toolkit.scripts.cluster:main"
dt-embed = "detection_toolkit.scripts.embed:main"
dt-thumbnails = "detection_toolkit.scripts.thumbnails:main"
dt-split = "detection_toolkit.scripts.split:main"
dt-visualize = "detection_toolkit.scripts.visualize:main"
dt-rename = "detection_toolkit.scripts.rename:main"

[project.urls]
Homepage = "https://github.com/vittorio-prodomo/detection-toolkit"
Issues = "https://github.com/vittorio-prodomo/detection-toolkit/issues"

[tool.uv.sources]
cocoyolo = { path = "../cocoyolo", editable = true }
fiftyone = { path = "../fiftyone-fork", editable = true }
voxel51-eta = { path = "../fiftyone-fork/eta", editable = true }
fiftyone-brain = { path = "../fiftyone-brain-fork" }

[tool.uv]
override-dependencies = [
    # Local forks — allow any version to bypass fiftyone's pinned constraints
    "fiftyone-brain>=0",
    "voxel51-eta>=0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/detection_toolkit"]

[tool.pytest.ini_options]
markers = [
    "requires_mongod: mark test as requiring a running MongoDB instance (skip if unavailable)",
]
